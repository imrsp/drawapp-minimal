<!DOCTYPE html>
<html lang="en">
<head>
	<title>DrawApp</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style type="text/css">
		@media (prefers-color-scheme: dark) {
			.adaptive-asset {
				filter: invert(1);
			}
		}
		body {
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans",
				Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
			background: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));
			color: light-dark(rgb(18, 18, 18), white);
			color-scheme: light dark;
			font-size: 12px;
		}
		hr {
			border: 0;
			border-top: 1px solid light-dark(rgb(0, 0, 0), rgb(255, 255, 255));
		}
		textarea {
			box-sizing: border-box;
			font-family: monospace;
			resize: vertical;
			font-size: inherit;
			border-radius: 4px;
			padding: 4px;
		}
		button {
			background: light-dark(#29b6f2, #003555);
			border-radius: 4px;
			padding: 10px;
			border: none;
		}
		button {
			cursor: default;
			opacity: 0.9;
		}
		button:hover:not(:disabled) {
			opacity: 1;
		}
		button:active:not(:disabled) {
			filter:invert(1);
		}
		input {
			padding: 2px 6px;
			margin: 0 0 0 4px;
			font-size: inherit;
		}
	</style>
</head>
<body>
	<div id="content" style="position:relative;display:block;left:50%;transform:translate(-50%,0);width:50%;padding-top:2%;text-align:center;white-space:nowrap;">
		<div style="display:flex;align-items:center;opacity:0.7;width:250px;min-width:130px;position:relative;left:50%;transform:translate(-50%,0);">
			<img src="images/electron-logo.svg" alt="DrawApp" style="width:28px;display:inline-block;">
			<span style="font-family:Helvetica;font-weight:700;font-size:20px;margin-left:4px;">DrawApp</span>
		</div>
		<script src="js/app.min.js"></script>
		<script src="js/clear.js"></script>
	</div>
</body>
</html>
