<!DOCTYPE html>
<html>
<head>
    <title>DrawApp</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="Description" content="DrawApp desktop diagram editor">
    <meta name="Keywords" content="drawio, diagram, online, flow chart, flowchart maker, uml, erd">
    <meta itemprop="name" content="DrawApp">
	<meta itemprop="description" content="DrawApp desktop diagram editor">
	<meta itemprop="image" content="https://lh4.googleusercontent.com/-cLKEldMbT_E/Tx8qXDuw6eI/AAAAAAAAAAs/Ke0pnlk8Gpg/w500-h344-k/BPMN%2Bdiagram%2Brc2f.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="msapplication-config" content="images/browserconfig.xml">
    <meta name="mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#d89000">
	<link rel="manifest" href="images/manifest.json">
	<link rel="icon" href="favicon.ico" sizes="any">
	<link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="styles/grapheditor.css">
	<link rel="stylesheet" media="(forced-colors: active)" href="styles/high-contrast.css" id="high-contrast-stylesheet">
	<script src="js/bootstrap.js"></script>
	<style type="text/css">
		#geInfo {
			display:flex;
			flex-direction:column;
			align-items:center;
			justify-content:center;
			gap:24px;
			padding:16px 16px 10vh 16px;
			text-align:center;
		}
		#geInfo noscript {
			max-width:600px;
		}
		#geStatus:empty {
			display:none;
		}
		#geStatus a {
			text-decoration:underline;
			cursor:pointer;
		}
		.geSplashLogo {
			width:72px;
			height:72px;
			animation:geSplashPulse 1.2s ease-in-out infinite alternate;
		}
		.geSplashLogoImage {
			object-fit:contain;
			border-radius:12px;
		}
		#geInfo:has(#geStatus:not(:empty)) .geSplashLogo {
			animation:none;
		}
		@media (prefers-reduced-motion: reduce), (scripting: none) {
			.geSplashLogo {
				animation:none;
			}
		}
		@keyframes geSplashPulse {
			from {
				opacity:1;
				transform:scale(1);
			}
			to {
				opacity:0.55;
				transform:scale(0.95);
			}
		}
	</style>
</head>
<body class="geEditor geClassic">
<div id="geInfo">
	<img id="geSplashFallback" class="geSplashLogo geSplashLogoImage" src="images/electron-logo.svg" role="img" aria-label="DrawApp" alt="DrawApp">
	<img id="geSplashLogoImage" class="geSplashLogo geSplashLogoImage" hidden alt="DrawApp">
	<div id="geStatus"></div>
	<noscript>
		<h1>DrawApp</h1>
		<p>
			DrawApp is a desktop diagram editor for flowcharts, process diagrams, org charts, UML, ER and network diagrams.
		</p>
		<p>
			Please ensure JavaScript is enabled.
		</p>
	</noscript>
</div>
<script src="js/branding-ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
